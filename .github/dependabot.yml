version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: '09:10'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:20'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
