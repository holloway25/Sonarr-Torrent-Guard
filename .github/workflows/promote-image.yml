name: Promote reviewed image
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Exact published candidate digest approved by review (sha256:...)
        type: string
        required: true
      candidate_run_id:
        description: Successful Container publication run for this candidate
        type: string
        required: true
      review_approved:
        description: Confirm review passed and this exact image is approved for latest
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: reviewed-image-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && inputs.review_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      CANDIDATE_DIGEST: ${{ inputs.digest }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tested candidate and promote without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          RUN_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")
          printf '%s\n' "$RUN_JSON" > "$RUNNER_TEMP/candidate-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/candidate-artifacts.json"
          ARTIFACT=$(python3 tools/release_evidence.py select --run "$RUNNER_TEMP/candidate-run.json" --artifacts "$RUNNER_TEMP/candidate-artifacts.json" --repository "$GITHUB_REPOSITORY" --run-id "$CANDIDATE_RUN_ID")
          ARTIFACT_ID=$(jq -r '.id' <<< "$ARTIFACT")
          ARTIFACT_DIGEST=$(jq -r '.digest' <<< "$ARTIFACT")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/candidate-publication.zip"
          python3 tools/release_evidence.py verify --run "$RUNNER_TEMP/candidate-run.json" --repository "$GITHUB_REPOSITORY" --run-id "$CANDIDATE_RUN_ID" --archive "$RUNNER_TEMP/candidate-publication.zip" --archive-digest "$ARTIFACT_DIGEST" --digest "$CANDIDATE_DIGEST"
          REVISION=$(jq -r '.head_sha' <<< "$RUN_JSON")
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker pull "$IMAGE@$CANDIDATE_DIGEST"
          ACTUAL_REVISION=$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$CANDIDATE_DIGEST")
          test "$ACTUAL_REVISION" = "$REVISION"
          docker tag "$IMAGE@$CANDIDATE_DIGEST" "$IMAGE:latest"
          docker push "$IMAGE:latest" | tee "$RUNNER_TEMP/guard-promotion.txt"
          grep -F "latest: digest: $CANDIDATE_DIGEST " "$RUNNER_TEMP/guard-promotion.txt"
          printf 'Published reviewed image: %s:latest -> %s\n' "$IMAGE" "$CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
