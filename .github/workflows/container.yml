name: Container
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested commit image to GHCR (does not deploy)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test source and privacy before building
        run: |
          python3 -m unittest test_guard test_safety test_production test_public test_timing test_routine test_metadata test_retention test_container
          python3 tools/privacy_check.py --all
      - name: Choose commit-specific image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --pull --tag "$IMAGE" .
      - name: Offline non-root read-only smoke check
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /config:uid=1000,gid=1000,mode=0700 --tmpfs /tmp --env-file deploy/container.env.example "$IMAGE" --check-config
          docker run --rm --network none --read-only --entrypoint python3 "$IMAGE" -c 'import os; from zoneinfo import ZoneInfo; assert os.getuid() != 0; assert ZoneInfo("Australia/Melbourne"); from authorization import code_digest; assert len(code_digest()) == 64'
          if docker run --rm --network none --read-only --tmpfs /config:uid=1000,gid=1000,mode=0700 --env-file deploy/container.env.example --env STGUARD_MODE=live "$IMAGE" --check-config; then
            echo "Live container mode must remain disabled pending review"
            exit 1
          fi
      - name: Offline active-cycle shutdown smoke check
        run: |
          docker run --detach --name guard-shutdown --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python3 "$IMAGE" -c '
          import signal, subprocess, sys
          from pathlib import Path
          import container_worker as worker
          child = subprocess.Popen([sys.executable, "-c", "import signal,time; signal.signal(signal.SIGTERM, signal.SIG_IGN); print(\"ready\", flush=True); time.sleep(60)"], stdout=subprocess.PIPE, text=True)
          assert child.stdout.readline().strip() == "ready"
          original_wait = child.wait
          def active_wait(*args, **kwargs):
              print("waiting", flush=True)
              return original_wait(*args, **kwargs)
          child.wait = active_wait
          worker.subprocess.Popen = lambda *args, **kwargs: child
          signal.signal(signal.SIGTERM, worker.stop_worker)
          result = worker.run_cycle("dry-run", Path("/config/connections.json"))
          assert result == 143 and child.poll() == -signal.SIGKILL
          child.stdout.close()
          '
          trap 'docker rm --force guard-shutdown >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 50); do
            if docker logs guard-shutdown | grep -q waiting; then break; fi
            sleep 0.1
          done
          docker logs guard-shutdown | grep -q waiting
          started=$SECONDS
          docker stop -t 8 guard-shutdown
          test "$((SECONDS - started))" -lt 8
          test "$(docker inspect --format='{{.State.ExitCode}}' guard-shutdown)" = 0
      - name: Publish only on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker inspect --format='Published {{index .RepoDigests 0}}' "$IMAGE"
          docker logout ghcr.io
