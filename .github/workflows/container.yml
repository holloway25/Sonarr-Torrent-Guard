name: Container
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested commit image to GHCR (does not deploy)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily candidate refresh, 09:17/10:17 Melbourne time (AEST/AEDT).
    - cron: '17 23 * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test source and privacy before building
        run: |
          python3 -m unittest discover -s tools/tests -t .
          python3 tools/privacy_check.py --all
      - name: Choose unique candidate image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Refresh compatible Python and Debian base for maintenance
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        run: |
          set -euo pipefail
          docker pull python:3.12-slim-bookworm
          BASE_REF=$(docker image inspect --format='{{index .RepoDigests 0}}' python:3.12-slim-bookworm)
          BASE_DIGEST="${BASE_REF##*@}"
          [[ "$BASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm --network none --read-only --entrypoint python3 "python@$BASE_DIGEST" -c 'import sys; from pathlib import Path; assert sys.version_info[:2] == (3, 12); assert "VERSION_CODENAME=bookworm" in Path("/etc/os-release").read_text()'
          python3 tools/dependency_release.py render --digest "$BASE_DIGEST" --output "$RUNNER_TEMP/dependency.Dockerfile"
          echo "BASE_DIGEST=$BASE_DIGEST" >> "$GITHUB_ENV"
          echo "BUILD_DOCKERFILE=$RUNNER_TEMP/dependency.Dockerfile" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --pull --no-cache --file "${BUILD_DOCKERFILE:-Dockerfile}" --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.base.name=python:3.12-slim-bookworm" --label "org.opencontainers.image.base.digest=${BASE_DIGEST:-repository-pin}" --label "io.stguard.build.run-id=$GITHUB_RUN_ID" --label "io.stguard.build.attempt=$GITHUB_RUN_ATTEMPT" --tag "$IMAGE" .
      - name: Offline non-root read-only smoke check
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /config:uid=1000,gid=1000,mode=0700 --tmpfs /tmp --env-file deploy/container.env.example "$IMAGE" --check-config
          docker run --rm --network none --read-only --entrypoint python3 "$IMAGE" -c 'import os; from zoneinfo import ZoneInfo; assert os.getuid() != 0; assert ZoneInfo("Australia/Melbourne"); from authorization import code_digest; assert len(code_digest()) == 64'
          if docker run --rm --network none --read-only --tmpfs /config:uid=1000,gid=1000,mode=0700 --env-file deploy/container.env.example --env STGUARD_MODE=live "$IMAGE" --check-config; then
            echo "Live container mode must refuse a missing explicit grant"
            exit 1
          fi
      - name: Offline active-cycle shutdown smoke check
        run: |
          docker run --detach --name guard-shutdown --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python3 "$IMAGE" -c '
          import signal, subprocess, sys
          from pathlib import Path
          import container_worker as worker
          child = subprocess.Popen([sys.executable, "-c", "import signal,time; signal.signal(signal.SIGTERM, signal.SIG_IGN); print(\"ready\", flush=True); time.sleep(60)"], stdout=subprocess.PIPE, text=True)
          assert child.stdout.readline().strip() == "ready"
          original_wait = child.wait
          def active_wait(*args, **kwargs):
              print("waiting", flush=True)
              return original_wait(*args, **kwargs)
          child.wait = active_wait
          worker.subprocess.Popen = lambda *args, **kwargs: child
          signal.signal(signal.SIGTERM, worker.stop_worker)
          result = worker.run_cycle("dry-run", Path("/config/connections.json"))
          assert result == 143 and child.poll() == -signal.SIGKILL
          child.stdout.close()
          '
          trap 'docker rm --force guard-shutdown >/dev/null 2>&1 || true' EXIT
          for _attempt in $(seq 1 50); do
            if docker logs guard-shutdown | grep -q waiting; then break; fi
            sleep 0.1
          done
          docker logs guard-shutdown | grep -q waiting
          started=$SECONDS
          docker stop -t 8 guard-shutdown
          test "$((SECONDS - started))" -lt 8
          test "$(docker inspect --format='{{.State.ExitCode}}' guard-shutdown)" = 0
      - name: Publish tested maintenance or explicitly requested candidate
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "$IMAGE" | tee "$RUNNER_TEMP/candidate-push.txt"
          DIGEST=$(sed -nE 's/.*: digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/candidate-push.txt")
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 tools/release_evidence.py record --digest "$DIGEST" --output "$RUNNER_TEMP/publication.json"
          printf 'Review candidate: %s\nDigest: %s\nRun: %s (attempt %s)\n' "$IMAGE" "$DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Store exact publication evidence for review and promotion
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          retention-days: 90
